name: mine
description: Mine by Techackode — upload your clothes and see what to wear each day. Developed by Ranjith Kumar C & Gayathri B.
publish_to: "none"
version: 1.0.3+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  camera: ^0.11.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  permission_handler: ^12.0.1
  audioplayers: ^6.5.1
  file_picker: ^10.3.3
  archive: ^4.0.7
  share_plus: ^11.1.0
  lottie: ^3.3.2
  image: ^4.10.1
  native_cutout: ^0.4.0
  http: ^1.2.2
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4
  webview_flutter_android: ^4.14.1
  image_background_remover: 2.0.1
  geolocator: ^14.0.2
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#F5F0EA"
  adaptive_icon_foreground: assets/brand/app_icon.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F7F7F7"
  android_12:
    color: "#F7F7F7"
  ios: true
  web: true
  # No centered logo here — Flutter LogoPrepageScreen is the real splash.

flutter:
  uses-material-design: true
  assets:
    - assets/coming_soon.json
    - assets/onboarding_bg.png
    - assets/gender_female.png
    - assets/gender_male.png
    - assets/girl1.jpg
    - assets/men1.webp
    - assets/back-arrow.png
    - assets/brand/
    - assets/nav/
    - assets/ecommerce/
    - assets/walkthrough/
    - assets/collections/men/
    - assets/collections/women/
    - assets/sky/sunny.mp4
    - assets/sky/cloudy.mp4
    - assets/sky/rainy.mp4
